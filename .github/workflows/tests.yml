name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  logic:
    name: logic tests (no network, no models)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The pure-logic tests need Pillow (speciesid imports it at module level) and numpy
      # (personal_classifier's decision logic is numpy, and it is a shipped module that
      # must be tested). torch, open_clip and PyQt6 are deliberately NOT installed — these
      # tests must stay runnable anywhere. Qt tests skip themselves and say so.
      - name: Install minimal deps
        run: pip install "Pillow>=10.0" "numpy>=1.24"

      # Discover rather than list: a new tests/test_*.py is picked up automatically, so
      # a test can never be written and silently not run.
      - name: Run every logic test
        run: |
          set -e
          shopt -s nullglob
          files=(tests/test_*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no tests found — refusing to report a green run"; exit 1
          fi
          fail=0
          for f in "${files[@]}"; do
            echo "::group::$f"
            python "$f" || fail=1
            echo "::endgroup::"
          done
          echo "ran ${#files[@]} suites"
          exit $fail

